<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест: центры субъектов РФ</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f6fb;
    margin: 0;
    padding: 20px;
    color: #1f2937;
  }
  .card {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,.08);
    padding: 28px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
  .progress {
    height: 8px; background: #e5e7eb; border-radius: 99px; overflow: hidden;
    margin-bottom: 24px;
  }
  .progress > div {
    height: 100%; width: 0%; background: #4f46e5; transition: width .3s;
  }
  .question {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 20px;
    text-align: center;
    line-height: 1.4;
  }
  .question span { color: #4f46e5; }
  .answer-box {
    background: #eef2ff;
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: #4f46e5;
    margin-bottom: 16px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity .25s, transform .25s;
  }
  .answer-box.show {
    opacity: 1;
    transform: translateY(0);
  }
  .answer-box.placeholder {
    color: #9ca3af;
    font-weight: 500;
    font-size: 16px;
    opacity: 1;
    transform: none;
    background: #f3f4f6;
  }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    padding: 12px 20px; font-size: 15px; border: none; border-radius: 10px;
    cursor: pointer; font-weight: 600; transition: transform .1s, opacity .2s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; }
  .primary { background: #4f46e5; color: #fff; }
  .primary:hover:not(:disabled) { opacity: .9; }
  .ok { background: #dcfce7; color: #166534; }
  .ok:hover:not(:disabled) { background: #bbf7d0; }
  .err { background: #fee2e2; color: #991b1b; }
  .err:hover:not(:disabled) { background: #fecaca; }
  .hidden { display: none; }
  .result { text-align: center; }
  .score { font-size: 48px; font-weight: 800; color: #4f46e5; margin: 10px 0; }
  .verdict { font-size: 16px; color: #374151; margin-bottom: 20px; }
  .stats { font-size: 14px; color: #6b7280; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="card">
  <h1>🧠 Центры субъектов РФ</h1>
  <div class="sub" id="subtitle">Вопрос 1</div>
  <div class="progress"><div id="bar"></div></div>

  <div id="quiz">
    <div class="question" id="question"></div>

    <div class="answer-box placeholder" id="answerBox">Нажми «Показать ответ»</div>

    <div class="buttons">
      <button class="primary" id="showBtn">Показать ответ</button>
      <button class="ok hidden" id="yesBtn">✅ Угадал</button>
      <button class="err hidden" id="noBtn">❌ Не угадал</button>
    </div>
  </div>

  <div id="result" class="hidden result">
    <div class="score" id="score"></div>
    <div class="verdict" id="verdict"></div>
    <div class="stats" id="stats"></div>
    <div class="buttons" style="justify-content:center">
      <button class="primary" id="restartBtn">Пройти заново</button>
    </div>
  </div>
</div>

<script>
const REGIONS = [
  ["Республика Адыгея", "Майкоп"],
  ["Республика Дагестан", "Махачкала"],
  ["Республика Ингушетия", "Магас"],
  ["Кабардино-Балкарская Республика", "Нальчик"],
  ["Карачаево-Черкесская Республика", "Черкесск"],
  ["Республика Северная Осетия — Алания", "Владикавказ"],
  ["Чеченская Республика", "Грозный"],
  ["Республика Башкортостан", "Уфа"],
  ["Республика Марий Эл", "Йошкар-Ола"],
  ["Республика Мордовия", "Саранск"],
  ["Республика Татарстан", "Казань"],
  ["Удмуртская Республика", "Ижевск"],
  ["Чувашская Республика", "Чебоксары"],
  ["Республика Алтай", "Горно-Алтайск"],
  ["Республика Бурятия", "Улан-Удэ"],
  ["Республика Тыва", "Кызыл"],
  ["Республика Хакасия", "Абакан"],
  ["Республика Карелия", "Петрозаводск"],
  ["Республика Коми", "Сыктывкар"],
  ["Республика Саха (Якутия)", "Якутск"],
  ["Республика Калмыкия", "Элиста"],
  ["Республика Крым", "Симферополь"],
  ["Донецкая Народная Республика", "Донецк"],
  ["Луганская Народная Республика", "Луганск"],
  ["Москва", "Москва"],
  ["Санкт-Петербург", "Санкт-Петербург"],
  ["Севастополь", "Севастополь"],
  ["Ненецкий автономный округ", "Нарьян-Мар"],
  ["Ханты-Мансийский автономный округ — Югра", "Ханты-Мансийск"],
  ["Чукотский автономный округ", "Анадырь"],
  ["Ямало-Ненецкий автономный округ", "Салехард"],
  ["Еврейская автономная область", "Биробиджан"],
  ["Алтайский край", "Барнаул"],
  ["Забайкальский край", "Чита"],
  ["Камчатский край", "Петропавловск-Камчатский"],
  ["Краснодарский край", "Краснодар"],
  ["Красноярский край", "Красноярск"],
  ["Пермский край", "Пермь"],
  ["Приморский край", "Владивосток"],
  ["Ставропольский край", "Ставрополь"],
  ["Хабаровский край", "Хабаровск"],
  ["Белгородская область", "Белгород"],
  ["Брянская область", "Брянск"],
  ["Владимирская область", "Владимир"],
  ["Воронежская область", "Воронеж"],
  ["Ивановская область", "Иваново"],
  ["Калужская область", "Калуга"],
  ["Костромская область", "Кострома"],
  ["Курская область", "Курск"],
  ["Липецкая область", "Липецк"],
  ["Московская область", "Москва"],
  ["Орловская область", "Орёл"],
  ["Рязанская область", "Рязань"],
  ["Смоленская область", "Смоленск"],
  ["Тамбовская область", "Тамбов"],
  ["Тверская область", "Тверь"],
  ["Тульская область", "Тула"],
  ["Ярославская область", "Ярославль"],
  ["Архангельская область", "Архангельск"],
  ["Вологодская область", "Вологда"],
  ["Калининградская область", "Калининград"],
  ["Ленинградская область", "Санкт-Петербург"],
  ["Мурманская область", "Мурманск"],
  ["Новгородская область", "Великий Новгород"],
  ["Псковская область", "Псков"],
  ["Астраханская область", "Астрахань"],
  ["Волгоградская область", "Волгоград"],
  ["Ростовская область", "Ростов-на-Дону"],
  ["Запорожская область", "Мелитополь"],
  ["Херсонская область", "Геническ"],
  ["Кировская область", "Киров"],
  ["Нижегородская область", "Нижний Новгород"],
  ["Оренбургская область", "Оренбург"],
  ["Пензенская область", "Пенза"],
  ["Самарская область", "Самара"],
  ["Саратовская область", "Саратов"],
  ["Ульяновская область", "Ульяновск"],
  ["Курганская область", "Курган"],
  ["Свердловская область", "Екатеринбург"],
  ["Тюменская область", "Тюмень"],
  ["Челябинская область", "Челябинск"],
  ["Иркутская область", "Иркутск"],
  ["Кемеровская область — Кузбасс", "Кемерово"],
  ["Новосибирская область", "Новосибирск"],
  ["Омская область", "Омск"],
  ["Томская область", "Томск"],
  ["Амурская область", "Благовещенск"],
  ["Магаданская область", "Магадан"],
  ["Сахалинская область", "Южно-Сахалинск"]
];

const questionEl = document.getElementById("question");
const answerBox = document.getElementById("answerBox");
const showBtn = document.getElementById("showBtn");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const quizEl = document.getElementById("quiz");
const resultEl = document.getElementById("result");
const scoreEl = document.getElementById("score");
const verdictEl = document.getElementById("verdict");
const statsEl = document.getElementById("stats");
const barEl = document.getElementById("bar");
const subtitleEl = document.getElementById("subtitle");
const restartBtn = document.getElementById("restartBtn");

let queue = [];
let current = 0;
let correct = 0;

const shuffle = a => a.map(v => [Math.random(), v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

function start() {
  queue = shuffle(REGIONS.slice());
  current = 0;
  correct = 0;
  quizEl.classList.remove("hidden");
  resultEl.classList.add("hidden");
  showQuestion();
}

function showQuestion() {
  const [region] = queue[current];
  questionEl.innerHTML = `Центр «<span>${region}</span>» — это...`;
  subtitleEl.textContent = `Вопрос ${current + 1} из ${queue.length}`;
  barEl.style.width = (current / queue.length * 100) + "%";

  answerBox.textContent = "Нажми «Показать ответ»";
  answerBox.className = "answer-box placeholder";

  showBtn.classList.remove("hidden");
  showBtn.disabled = false;
  yesBtn.classList.add("hidden");
  noBtn.classList.add("hidden");
}

function revealAnswer() {
  const [, center] = queue[current];
  answerBox.textContent = center;
  answerBox.className = "answer-box show";

  showBtn.classList.add("hidden");
  yesBtn.classList.remove("hidden");
  noBtn.classList.remove("hidden");
}

function answer(isCorrect) {
  if (isCorrect) correct++;
  current++;
  if (current >= queue.length) finish();
  else showQuestion();
}

function finish() {
  barEl.style.width = "100%";
  quizEl.classList.add("hidden");
  resultEl.classList.remove("hidden");

  const total = queue.length;
  const percent = Math.round(correct / total * 100);
  scoreEl.textContent = `${correct} / ${total}`;
  statsEl.textContent = `${percent}% правильных ответов`;

  if (percent === 100) verdictEl.textContent = "🏆 Идеально! Все ответы верные.";
  else if (percent >= 80) verdictEl.textContent = "👍 Хорошо, но есть что подтянуть.";
  else if (percent >= 50) verdictEl.textContent = "📚 Стоит повторить материал.";
  else verdictEl.textContent = "💪 Нужно ещё потренироваться.";
}

showBtn.addEventListener("click", revealAnswer);
yesBtn.addEventListener("click", () => answer(true));
noBtn.addEventListener("click", () => answer(false));
restartBtn.addEventListener("click", start);

// Управление с клавиатуры:
// Пробел / Enter — показать ответ, затем 1 — угадал, 2 — не угадал
document.addEventListener("keydown", e => {
  if (!quizEl.classList.contains("hidden")) {
    if ((e.key === " " || e.key === "Enter") && !showBtn.classList.contains("hidden")) {
      e.preventDefault();
      revealAnswer();
    } else if (e.key === "1" && !yesBtn.classList.contains("hidden")) {
      answer(true);
    } else if (e.key === "2" && !noBtn.classList.contains("hidden")) {
      answer(false);
    }
  }
});

start();
</script>
</body>
</html>
