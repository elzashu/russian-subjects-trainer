<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Субъекты РФ — тренажёр</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .app { width: 100%; max-width: 700px; }
  .screen { display: none; }
  .screen.active { display: block; }

  .menu h1 { font-size: 1.8em; margin-bottom: 8px; color: #f1f5f9; }
  .menu p { color: #94a3b8; margin-bottom: 30px; }
  .menu-btn {
    display: block; width: 100%; padding: 20px; margin-bottom: 12px;
    background: #1e293b; border: 2px solid #334155; border-radius: 14px;
    color: #e2e8f0; font-size: 1.1em; text-align: left;
    cursor: pointer; transition: 0.2s;
  }
  .menu-btn:hover {
    background: #334155; border-color: #6366f1; transform: translateX(4px);
  }
  .menu-btn .count { float: right; color: #64748b; font-size: 0.9em; }

  .card {
    background: #1e293b; border-radius: 20px; padding: 32px;
    border: 2px solid #334155;
  }
  .card h2 { font-size: 1.5em; margin-bottom: 6px; color: #f1f5f9; }
  .card .subtitle { color: #64748b; margin-bottom: 24px; font-size: 0.95em; }
  .group {
    background: #0f172a; border-radius: 12px; padding: 16px 20px;
    margin-bottom: 14px; border-left: 4px solid #6366f1;
  }
  .group-title {
    font-size: 0.85em; color: #818cf8; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 10px; font-weight: 600;
  }
  .group-items { display: flex; flex-wrap: wrap; gap: 8px; }
  .item {
    background: #1e293b; padding: 8px 14px; border-radius: 8px;
    font-size: 0.95em; color: #e2e8f0;
  }

  .actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn {
    flex: 1; padding: 14px; border: none; border-radius: 10px;
    font-size: 1em; cursor: pointer; font-weight: 600; transition: 0.2s;
  }
  .btn-primary { background: #6366f1; color: white; }
  .btn-primary:hover { background: #4f46e5; }
  .btn-secondary { background: #334155; color: #e2e8f0; }
  .btn-secondary:hover { background: #475569; }

  .quiz-question {
    font-size: 1.3em; margin-bottom: 20px; color: #f1f5f9;
  }
  .quiz-options {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 14px;
  }
  .quiz-option {
    padding: 16px; background: #0f172a; border: 2px solid #334155;
    border-radius: 12px; color: #e2e8f0; font-size: 1em;
    cursor: pointer; transition: 0.2s; text-align: left;
    font-family: inherit;
  }
  .quiz-option:hover:not(:disabled) {
    border-color: #6366f1; background: #1e293b;
  }
  .quiz-option:disabled { cursor: default; }
  .quiz-option.correct {
    background: #064e3b; border-color: #10b981; color: #6ee7b7;
  }
  .quiz-option.wrong {
    background: #7f1d1d; border-color: #ef4444; color: #fca5a5;
  }
  .feedback {
    padding: 16px; border-radius: 10px; margin-top: 14px;
    font-weight: 500; text-align: center;
  }
  .feedback.correct { background: #064e3b; color: #6ee7b7; }
  .feedback.wrong { background: #7f1d1d; color: #fca5a5; }

  .progress-bar {
    height: 6px; background: #1e293b; border-radius: 3px;
    margin-bottom: 20px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: #6366f1; transition: width 0.3s;
  }
</style>
</head>
<body>
<div class="app">

  <!-- ГЛАВНОЕ МЕНЮ -->
  <div id="menu" class="screen active">
    <div class="menu">
      <h1>🎓 Субъекты РФ</h1>
      <p>Выбери блок для изучения</p>
      <div id="menu-buttons"></div>
    </div>
  </div>

  <!-- ПОДМЕНЮ -->
  <div id="submenu" class="screen">
    <div class="menu">
      <h1 id="submenu-title"></h1>
      <p id="submenu-subtitle"></p>
      <div id="submenu-buttons"></div>
      <button class="btn btn-secondary" style="margin-top: 20px;" onclick="goMenu()">← Меню</button>
    </div>
  </div>

  <!-- КАРТОЧКА -->
  <div id="card-screen" class="screen">
    <div class="card">
      <h2 id="card-title"></h2>
      <p class="subtitle" id="card-subtitle"></p>
      <div id="card-groups"></div>
      <div class="actions">
        <button class="btn btn-secondary" id="card-back" onclick="goMenu()">← Меню</button>
        <button class="btn btn-primary" onclick="startQuiz()">Проверить себя →</button>
      </div>
    </div>
  </div>

  <!-- ТЕСТ -->
  <div id="quiz-screen" class="screen">
    <div class="card">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="quiz-question" id="quiz-question"></div>
      <div class="quiz-options" id="quiz-options"></div>
      <div id="quiz-feedback"></div>
      <div class="actions">
        <button class="btn btn-secondary" onclick="goMenu()">← Меню</button>
      </div>
    </div>
  </div>

</div>

function renderMenu() {

    { key: "okrug", label: "🌲 Автономные округа" },

  ];
  blocks.forEach(b => {
    const btn = document.createElement("button");
    btn.className = "menu-btn";
    const data = DATA[b.key];
    if (data.subgroups) {
      btn.innerHTML = `${b.label} <span class="count">${Object.keys(data.subgroups).length} групп</span>`;
    } else {
      btn.innerHTML = `${b.label} <span class="count">${data.quiz.length} вопр.</span>`;
    }
    btn.onclick = () => openBlock(b.key);
    menu.appendChild(btn);
  });

  // Кнопка перехода в тест
  const testBtn = document.createElement("button");
  testBtn.className = "menu-btn";
  testBtn.style.borderColor = "#10b981";
  testBtn.innerHTML = `📝 Пройти тест <span class="count">→</span>`;
  testBtn.onclick = () => window.location.href = "test.html";
  menu.appendChild(testBtn);
}

function openBlock(key) {
  currentBlock = key;
  const data = DATA[key];
  if (data.subgroups) {
    renderSubmenu(key);
    showScreen("submenu");
  } else {
    currentData = data;
    showCard();
  }
}

// ============ ПОДМЕНЮ ============
function renderSubmenu(key) {
  const data = DATA[key];
  document.getElementById("submenu-title").textContent = data.title;
  document.getElementById("submenu-subtitle").textContent = data.subtitle;

  const container = document.getElementById("submenu-buttons");
  container.innerHTML = "";

  const allBtn = document.createElement("button");
  allBtn.className = "menu-btn";
  const totalQ = Object.values(data.subgroups).reduce((s, sg) => s + sg.quiz.length, 0);
  const allLabel = key === "resp" ? "Все республики" : "Все области";
  allBtn.innerHTML = `📚 ${allLabel} <span class="count">${totalQ} вопр.</span>`;
  allBtn.onclick = () => openAll(key);
  container.appendChild(allBtn);

  Object.entries(data.subgroups).forEach(([sgKey, sg]) => {
    const btn = document.createElement("button");
    btn.className = "menu-btn";
    btn.innerHTML = `${sg.title} <span class="count">${sg.quiz.length} вопр.</span>`;
    btn.onclick = () => {
      currentData = sg;
      showCard();
    };
    container.appendChild(btn);
  });
}

function openAll(key) {
  const allGroups = [];
  const allQuiz = [];
  Object.values(DATA[key].subgroups).forEach(sg => {
    allGroups.push(...sg.groups);
    allQuiz.push(...sg.quiz);
  });
  const label = key === "resp" ? "Все республики" : "Все области";
  currentData = { title: label, subtitle: "Все группы", groups: allGroups, quiz: allQuiz };
  showCard();
}

// ============ ЭКРАНЫ ============
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function showCard() {
  document.getElementById("card-title").textContent = currentData.title;
  document.getElementById("card-subtitle").textContent = currentData.subtitle;

  const container = document.getElementById("card-groups");
  container.innerHTML = "";
  currentData.groups.forEach(g => {
    const div = document.createElement("div");
    div.className = "group";
    div.innerHTML = `
      <div class="group-title">${g.name}</div>
      <div class="group-items">
        ${g.items.map(i => `<span class="item">${i}</span>`).join("")}
      </div>
    `;
    container.appendChild(div);
  });

  const backBtn = document.getElementById("card-back");
  if (currentBlock === "resp" || currentBlock === "oblast") {
    backBtn.textContent = "← К группам";
    backBtn.onclick = () => { renderSubmenu(currentBlock); showScreen("submenu"); };
  } else {
    backBtn.textContent = "← Меню";
    backBtn.onclick = goMenu;
  }

  showScreen("card-screen");
}

function goMenu() {
  showScreen("menu");
  renderMenu();
}

// ============ ТЕСТ ============
function startQuiz() {
  quizIndex = 0;
  score = 0;
  showScreen("quiz-screen");
  renderQuiz();
}

function renderQuiz() {
  const data = currentData;
  if (quizIndex >= data.quiz.length) {
    document.getElementById("quiz-question").textContent =
      `✅ Готово! Результат: ${score}/${data.quiz.length}`;
    document.getElementById("quiz-options").innerHTML = "";
    document.getElementById("quiz-feedback").innerHTML = "";
    document.getElementById("progress-fill").style.width = "100%";
    return;
  }

  const q = data.quiz[quizIndex];
  document.getElementById("quiz-question").textContent = q.q;
  document.getElementById("quiz-feedback").innerHTML = "";
  document.getElementById("progress-fill").style.width =
    `${(quizIndex / data.quiz.length) * 100}%`;

  const optionsContainer = document.getElementById("quiz-options");
  optionsContainer.innerHTML = "";
  const shuffled = [...q.options].sort(() => Math.random() - 0.5);

  shuffled.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "quiz-option";
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(btn, opt, q);
    optionsContainer.appendChild(btn);
  });
}

function checkAnswer(btn, chosen, q) {
  const buttons = document.querySelectorAll(".quiz-option");
  buttons.forEach(b => b.disabled = true);

  const feedback = document.getElementById("quiz-feedback");

  if (chosen === q.correct) {
    score++;
    btn.classList.add("correct");
    feedback.className = "feedback correct";
    feedback.textContent = `✅ Верно! (${score}/${currentData.quiz.length})`;
  } else {
    btn.classList.add("wrong");
    buttons.forEach(b => {
      if (b.textContent === q.correct) b.classList.add("correct");
    });
    feedback.className = "feedback wrong";
    feedback.textContent = `❌ Правильно: ${q.correct}`;
  }

  quizIndex++;
  setTimeout(renderQuiz, chosen === q.correct ? 800 : 1800);
}

renderMenu();
</script>
